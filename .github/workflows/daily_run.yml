name: Daily CineJoy Updater

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Headless Browser
        run: |
          pip install beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Run Scraper
        run: python update_cinejoy.py

      - name: Commit updated M3U file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add my_cinema.m3u
          git diff-index --quiet HEAD || git commit -m "Auto-update playlist"
          git push
